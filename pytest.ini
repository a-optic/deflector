[pytest]
# Repo root on sys.path, declared rather than inherited.
#
# Tests live in tests/ directories now, not beside the modules they import
# (`import main`, `import capture`). That still resolved after the move, but
# only as a SIDE EFFECT: pytest's prepend import mode inserts the directory of
# each collected conftest.py into sys.path, and conftest.py sits at the repo
# root. So the suite depended on a root conftest.py continuing to exist, for a
# reason unrelated to why it exists -- delete or relocate it and every
# `import main` breaks at collection, with nothing pointing at the cause.
#
# This makes the dependency explicit and keeps conftest.py free to move on its
# own merits. (It should not move: its autouse fixtures apply to every test
# BELOW it, so relocating it into tests/ would quietly stop protecting
# privacy/tests/, lifeos/tests/ and providers/tests/ -- see its docstring.)
pythonpath = .

# No `testpaths`: discovery walks the tree, so a new package that adds its own
# tests/ directory is picked up without editing this file. The convention is
# one tests/ directory per package, plus tests/ at the root for the top-level
# modules.
